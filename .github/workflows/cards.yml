name: Update profile cards

on:
  schedule:
    - cron: '17 4 * * *'      # her gun 04:17 UTC
  workflow_dispatch:           # elle calistirma
  push:
    paths:
      - 'gen_cards.py'
      - '.github/workflows/cards.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kartlari uret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python gen_cards.py

      - name: Degisiklikleri commit et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg langs.svg streak.svg
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "chore: profil kartlarini guncelle [skip ci]"
            git push
          fi
